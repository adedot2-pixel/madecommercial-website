# Pipeline Follow-up Tool - configuration
# ------------------------------------------------------------------
# Copy this file to config/config.yaml and edit. Run
#     python -m pipeline_followup inspect --file "path\to\Pipeline.xlsx"
# to get a suggested mapping (config/config.suggested.yaml) for a new sheet.
# Relative paths are resolved from the folder this config file sits in.

source:
  path: "../demo/Pipeline.xlsx"   # local path or a path on a mapped/shared drive
  sheet: null                     # sheet name; null = first sheet
  header_row: auto                # "auto" or a 1-based row number

# Tool field -> the spreadsheet's header. Matching ignores case and extra spaces.
# A list means "whichever of these exists" - useful if the EA renames a column.
# Leave a field out (or null) if the sheet does not have it.
columns:
  record_id: ["CRM ID", "ID", "Record ID"]   # optional unique ID; keeps history stable if names change
  name: ["Contact", "Contact name", "Name"]
  firm: ["Company", "Firm", "Organisation"]
  email: ["E-mail", "Email"]
  investor_type: ["Type", "Investor type"]
  stage: ["Status", "Stage"]
  last_contact_date: ["Last touch", "Last contact", "Last contact date"]
  last_contact_type: ["Via", "Last contact type"]
  last_actor: ["Last move by", "Who acted last", "Last actor"]
  next_action: ["Next step", "Next action"]
  next_action_date: ["Next step date", "Next action date"]
  owner: ["Owner"]
  ticket_size: ["Ticket", "Ticket size", "Potential ticket"]
  notes: ["Comments", "Notes"]

# Standard stages (fixed list, in pipeline order) -> what people actually type.
# Matching ignores case/punctuation; close misspellings are matched and flagged.
stages:
  Intro: ["intro", "introduced", "initial", "first contact", "cold"]
  Meeting held: ["met", "meeting", "mtg held", "meeting done", "1st meeting"]
  Materials sent: ["deck sent", "materials", "ppm sent", "info sent", "ddq sent"]
  Due diligence: ["dd", "ddq", "in dd", "diligence", "odd", "operational dd"]
  Soft commit: ["soft circle", "soft circled", "verbal", "verbal commit"]
  Invested: ["funded", "closed", "invested", "subscribed", "existing lp"]
  Dormant: ["on hold", "dead", "pass", "passed", "parked", "not now"]

# Show their wording instead of the standard name, e.g. {"Due diligence": "DD"}
display_stage_names: {}

values:
  investor_type:
    prospect: ["prospect", "new", "target"]
    existing_investor: ["lp", "existing", "existing investor", "investor", "client"]
    consultant: ["consultant", "advisor", "adviser", "gatekeeper"]
  last_contact_type:
    meeting: ["meeting", "mtg", "met", "in person", "lunch", "dinner", "video call", "teams", "zoom"]
    call: ["call", "phone", "tel"]
    email: ["email", "e-mail", "mail"]
  last_actor:
    us: ["us", "we", "me", "ours", "calder ridge", "cr"]
    them: ["them", "they", "client", "theirs", "investor"]
  # "acted_last": the column says who made the last move (default).
  # "whose_turn": the column says whose move it is next (e.g. "Ball in court: us"),
  #               so "us" there means THEY acted last. The tool flips it.
  last_actor_column_means: acted_last
  # Strings that mean "no value" (no warning raised)
  blanks: ["", "-", "--", "n/a", "na", "none", "tbc", "tbd", "?", "unknown"]
  # Tried in order; anything else falls back to a day-first parser.
  date_formats: ["%d/%m/%Y", "%d/%m/%y", "%d-%b-%y", "%d-%b-%Y", "%d %b %Y", "%d %B %Y", "%Y-%m-%d", "%d.%m.%Y"]
  day_first: true

tickets:
  default_currency: USD      # used when a ticket has no currency marker
  default_unit: 1000000      # a bare "25" means 25m
  base_currency: USD         # totals and scoring are converted into this
  fx_as_of: "2026-11-01"     # date the rates below were set; a warning appears when older than fx_max_age_days
  fx_max_age_days: 90
  fx_to_base:                # fixed rates, 1 unit of currency = x base. Update periodically.
    USD: 1.0
    EUR: 1.08
    GBP: 1.27
    CHF: 1.13
    SEK: 0.095
    NOK: 0.093
    DKK: 0.145
    AED: 0.272
    SAR: 0.267
    JPY: 0.0067

rules:
  explicit_next_action: true          # a next action date always wins
  after_meeting_working_days: 2
  they_acted_last: {days: 3, working_days: true}
  we_acted_last: {days: 10, working_days: false}
  unknown_actor: {days: 10, working_days: false}   # who acted last not recorded
  going_cold_days: 30
  excluded_stages: ["Invested", "Dormant"]
  include_unknown_stage: true          # follow up rows whose stage is blank/unrecognised
  working_calendar: UK                 # UK (England & Wales) bank holidays, or "none"
  extra_holidays: []                   # e.g. ["2026-12-24", "2026-12-31"]

priority:
  weights: {urgency: 45, stage: 35, ticket: 20}   # max score = sum = 100
  overdue_cap_days: 14
  going_cold_bonus: 0.15
  stage_weight:
    Intro: 0.2
    Meeting held: 0.4
    Materials sent: 0.55
    Due diligence: 0.8
    Soft commit: 1.0
    Invested: 0.3
    Dormant: 0.1
    unknown: 0.3
  missing_ticket: median               # "median" of known tickets, or "zero"

drafts:
  sender_name: "Alex Hart"
  sender_title: "Head of EMEA"
  fund_name: "Calder Ridge Capital"
  sign_off: "Best regards"
  ai:
    enabled: false                     # OFF by default. Template drafts are used when off.
    provider: ollama                   # "ollama" = local model on this machine (recommended first)
                                       # "anthropic" = Anthropic API (data leaves the machine)
    model: "llama3.1:8b"               # e.g. "llama3.1:8b" for ollama, "claude-opus-5-5" for anthropic
    ollama_url: "http://127.0.0.1:11434"   # must be this machine (127.0.0.1 / localhost)
    send_notes: false                  # include free-text sheet notes in the AI prompt
    # Sign-off gate for any provider that sends data off this machine. The tool refuses to use
    # "anthropic" until this is filled in with who approved it and when (IT + Compliance).
    external_provider_approval: null   # e.g. "Approved by J. Smith (Compliance) and IT, 2026-12-01, ref CR-123"

digest:
  to: ["alex.hart@calderridge.example"]   # pre-fills the .eml "To" line only. Nothing is sent.
  write_eml: true
  show_upcoming_days: 14

output:
  dir: "../output"                     # one dated sub-folder per run
  excel_export: true

state:
  db: "../data/state.db"               # put on the shared drive so the EA and Alex share snooze/done/notes
  log: "../data/runs.log"
  snapshot_retention_days: 120

dashboard:
  host: "127.0.0.1"                    # local only. Do not change to 0.0.0.0.
  port: 8765
